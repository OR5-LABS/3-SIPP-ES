site_name: 3-SIPP-ES
site_description: A compact, high-performance 3-stage pipelined RV32IMAC processor core
site_author: 3-SIPP-ES Contributors
copyright: Copyright &copy; 2026 3-SIPP-ES Contributors

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - Instruction Set: isa.md
  - Branch Prediction: branch-prediction.md
  - Memory Map: memory-map.md
  - Control & Status Registers: csrs.md
  - Traps & Interrupts: traps-and-interrupts.md
  - Privilege & Security: privilege-and-security.md
  - Debug: debug.md
  - Bus Integration: bus-integration.md
  - FPGA Bring-up: fpga.md
  - Verification: verification.md
  - Configuration Reference: configuration.md

plugins:
  - search
